<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Delights">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F9D5E1">
<meta name="color-scheme" content="light">
<title>Delights Recipes</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{--bg:#F9D5E1;--card:#FFFAF6;--ink:#3A2330;--muted:#8E6F7D;--line:#F0D9E1;--acc:#D6457A;--acch:#BC3466;--acc2:#FFF1F5;--green:#3E6B4F;--greenbg:#E3EEE6;--warn:#7A5000;--warnbg:#FBEFD5;--shadow:0 1px 2px rgba(60,40,20,.06),0 6px 18px rgba(60,40,20,.06);--r:18px;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Inter,system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,textarea,select{font:inherit;color:var(--ink)}
svg{flex:none}
.app{max-width:880px;margin:0 auto;padding:calc(var(--sat) + 10px) 18px calc(var(--sab) + 110px)}
.top{display:flex;align-items:center;gap:10px;min-height:50px;margin-bottom:10px}
h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:34px;line-height:1.1;margin:0;letter-spacing:-.015em}
h2{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:22px;margin:28px 0 12px;letter-spacing:-.01em}
.spacer{flex:1}
.brand{font-family:'Great Vibes',cursive;font-weight:400;font-size:46px;line-height:1;letter-spacing:0;color:var(--acc);margin:0;padding-top:4px;white-space:nowrap;text-shadow:0 1px 0 rgba(255,255,255,.6)}
@media(max-width:400px){.brand{font-size:40px}.top .sync .lbl{display:none}}
.muted{color:var(--muted)}
.center{text-align:center}
.ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--shadow);border:1px solid var(--line);flex:none}
.ib svg{width:20px;height:20px}
.ib.on{color:var(--acc)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-weight:600;font-size:15px;border:1px solid var(--line);white-space:nowrap}
.btn.pri{background:var(--acc);color:#fff;border-color:transparent}
.btn.pri:active{background:var(--acch)}
.btn.danger{background:#B8304F;color:#fff;border-color:transparent}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px}
.btn.block{width:100%}
.btn svg{width:18px;height:18px}
.btn:disabled{opacity:.5;cursor:default}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.btnrow .btn{flex:1}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 14px;height:48px;margin-bottom:12px}
.search svg{width:18px;height:18px;color:var(--muted)}
.search input{flex:1;border:0;outline:0;background:none;height:100%;font-size:16px;min-width:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 14px;scrollbar-width:none;margin:0 -18px;padding-left:18px;padding-right:18px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip svg{width:15px;height:15px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);text-align:left;display:block;width:100%;border:1px solid var(--line)}
.ph{aspect-ratio:4/3;background:var(--acc2);display:grid;place-items:center;font-family:Fraunces,Georgia,serif;font-size:46px;color:var(--acc);position:relative;overflow:hidden}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.favb{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;color:#D6457A}
.favb svg{width:16px;height:16px}
.card .t{padding:10px 12px 2px;font-weight:600;font-size:15px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .m{padding:2px 12px 12px;color:var(--muted);font-size:13px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(var(--sab) + 6px);z-index:30}
nav.tabs button{flex:1;max-width:150px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 0;position:relative}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--acc)}
.badge{position:absolute;top:2px;left:calc(50% + 6px);background:var(--acc);color:#fff;border-radius:999px;font-size:10px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px}
.fab{position:fixed;right:max(18px,calc(50% - 422px));bottom:calc(var(--sab) + 82px);height:56px;padding:0 22px 0 18px;border-radius:999px;background:var(--acc);color:#fff;display:flex;align-items:center;gap:8px;font-weight:700;box-shadow:0 8px 24px rgba(214,69,122,.35);z-index:31}
.fab svg{width:22px;height:22px}
.sync{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.dot.ok{background:#3FA56B}.dot.warn{background:#D89A1C}
.empty{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:30px 22px;text-align:center;box-shadow:var(--shadow)}
.empty h3{font-family:Fraunces,Georgia,serif;font-size:24px;margin:6px 0 8px;font-weight:600}
.empty p{color:var(--muted);margin:0 auto 20px;max-width:420px}
.empty .big{width:64px;height:64px;border-radius:20px;background:var(--acc2);color:var(--acc);display:grid;place-items:center;margin:0 auto}
.empty .big svg{width:32px;height:32px}
/* detail */
.hero{margin:0 -18px 16px;aspect-ratio:4/3;max-height:440px;width:calc(100% + 36px);background:var(--acc2);position:relative;overflow:hidden;display:grid;place-items:center;font-family:Fraunces,Georgia,serif;font-size:80px;color:var(--acc)}
@media(min-width:700px){.hero{margin:0 0 18px;width:100%;border-radius:var(--r)}}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero .addp{position:absolute;bottom:12px;right:12px;font-family:Inter,system-ui,sans-serif;font-size:14px;color:var(--ink)}
.detail-top{position:sticky;top:0;z-index:5;margin:0 -18px;padding:calc(var(--sat) + 6px) 18px 6px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.rtitle{font-family:Fraunces,Georgia,serif;font-size:30px;line-height:1.15;font-weight:600;margin:0 0 6px;letter-spacing:-.015em}
.desc{color:var(--muted);margin:0 0 12px}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;padding:6px 11px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
.pill svg{width:15px;height:15px;color:var(--muted)}
.src{display:inline-flex;align-items:center;gap:6px;color:var(--acc);font-weight:600;font-size:14px;text-decoration:none;margin-bottom:14px}
.src svg{width:15px;height:15px}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--warnbg);color:var(--warn);border-radius:14px;padding:12px 14px;font-size:14px;margin:0 0 14px}
.note svg{width:18px;height:18px;margin-top:1px}
.note .x{margin-left:auto;opacity:.7}
.note.info{background:var(--greenbg);color:var(--green)}
.sec{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 8px;box-shadow:var(--shadow);margin-bottom:16px}
.sechead{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.sechead h2{margin:0;font-size:21px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;height:36px}
.stepper button{width:36px;height:34px;display:grid;place-items:center}
.stepper button svg{width:16px;height:16px}
.stepper span{min-width:76px;text-align:center;font-size:14px;font-weight:600}
ul.ings{list-style:none;padding:0;margin:0}
ul.ings li{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line);cursor:pointer}
ul.ings li:first-child{border-top:0}
ul.ings li.h{font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);cursor:default;padding-top:16px}
ul.ings .box{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);flex:none;display:grid;place-items:center;margin-top:1px}
ul.ings .box svg{width:14px;height:14px;opacity:0}
ul.ings li.on .box{background:var(--green);border-color:var(--green);color:#fff}
ul.ings li.on .box svg{opacity:1}
ul.ings li.on .txt{text-decoration:line-through;color:var(--muted)}
.q{font-weight:700}
ol.steps{list-style:none;padding:0;margin:0;counter-reset:s}
ol.steps li{counter-increment:s;display:flex;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
ol.steps li:first-child{border-top:0}
ol.steps li::before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:var(--acc2);color:var(--acc);font-weight:700;font-size:14px;display:grid;place-items:center}
.tbtn{display:inline-flex;align-items:center;gap:4px;background:var(--acc2);color:var(--acc);font-weight:600;border-radius:8px;padding:0 6px;font-size:.95em}
.tbtn svg{width:13px;height:13px}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-bottom:8px}
.gallery .g{aspect-ratio:1;border-radius:12px;overflow:hidden;position:relative;background:var(--acc2)}
.gallery .g img{width:100%;height:100%;object-fit:cover}
.gallery .add{border:2px dashed var(--line);background:none;display:grid;place-items:center;color:var(--muted);aspect-ratio:1;border-radius:12px}
.gallery .add svg{width:26px;height:26px}
.notes{white-space:pre-wrap;padding-bottom:10px}
/* forms */
.field{display:block;margin-bottom:14px}
.field>span{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.inp{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;outline:0;font-size:16px}
.inp:focus{border-color:var(--acc)}
textarea.inp{resize:vertical;min-height:110px;line-height:1.5}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.hint{font-size:13px;color:var(--muted);margin:-6px 0 14px}
.photos{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px}
.photos .p{flex:none;width:104px;height:104px;border-radius:14px;overflow:hidden;position:relative;background:var(--acc2)}
.photos .p img{width:100%;height:100%;object-fit:cover}
.photos .p .rm{position:absolute;top:5px;right:5px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center}
.photos .p .rm svg{width:14px;height:14px}
.photos .p .cv{position:absolute;left:5px;bottom:5px;font-size:11px;font-weight:700;background:rgba(0,0,0,.6);color:#fff;border-radius:6px;padding:2px 6px}
.photos .add{flex:none;width:104px;height:104px;border-radius:14px;border:2px dashed var(--line);display:grid;place-items:center;color:var(--muted);text-align:center;font-size:12px;font-weight:600}
.photos .add svg{width:24px;height:24px;margin:0 auto 4px;display:block}
.spin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;margin-bottom:16px}
.seg button{flex:1;height:40px;border-radius:10px;font-weight:600;font-size:14px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}
.seg button svg{width:16px;height:16px}
.seg button.on{background:var(--acc2);color:var(--acc)}
.busy{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.err{background:#FBE3DF;color:#8E2A1C;border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:14px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.thumbs .p{width:84px;height:84px;border-radius:12px;overflow:hidden;position:relative}
.thumbs .p img{width:100%;height:100%;object-fit:cover}
.thumbs .p .rm{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center}
.thumbs .p .rm svg{width:13px;height:13px}
.check{display:flex;gap:10px;align-items:center;font-size:14px;margin-bottom:14px}
.check input{width:20px;height:20px;accent-color:var(--acc)}
/* shopping */
.addrow{display:flex;gap:8px;margin-bottom:16px}
.addrow .inp{flex:1}
.addrow .btn{flex:none;width:48px;padding:0}
.cat{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 4px 6px}
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.it{display:flex;align-items:center;gap:12px;padding:12px 10px 12px 14px;border-top:1px solid var(--line)}
.it:first-child{border-top:0}
.it .cb{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.it .cb svg{width:14px;height:14px;opacity:0}
.it.done .cb{background:var(--green);border-color:var(--green);color:#fff}
.it.done .cb svg{opacity:1}
.it .nm{flex:1;min-width:0}
.it .nm b{font-weight:700}
.it .nm small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it.done .nm{color:var(--muted);text-decoration:line-through}
.it .x{width:34px;height:34px;display:grid;place-items:center;color:var(--muted);border-radius:50%}
.it .x svg{width:16px;height:16px}
/* chat */
.msgs{display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
.msg{max-width:88%;padding:12px 15px;border-radius:18px;font-size:15px;line-height:1.5;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--acc);color:#fff;border-bottom-right-radius:6px;white-space:pre-wrap}
.msg.a{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg.a p{margin:0 0 8px}.msg.a p:last-child{margin:0}
.msg.a ul,.msg.a ol{margin:4px 0 8px;padding-left:20px}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.act{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;background:var(--greenbg);color:var(--green);border-radius:999px;padding:5px 10px}
.act svg{width:13px;height:13px}
.composer{position:fixed;left:0;right:0;bottom:calc(var(--sab) + 64px);padding:8px 18px;z-index:29;background:linear-gradient(transparent,var(--bg) 30%)}
.composer .in{max-width:844px;margin:0 auto;display:flex;gap:8px;align-items:flex-end;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:6px 6px 6px 16px;box-shadow:var(--shadow)}
.composer textarea{flex:1;border:0;outline:0;background:none;resize:none;max-height:140px;min-height:24px;padding:8px 0;font-size:16px;line-height:1.4}
.composer .send{width:40px;height:40px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;flex:none}
.composer .send svg{width:18px;height:18px}
.sugg{display:flex;flex-direction:column;gap:8px}
.sugg button{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:15px}
/* cook */
.cook{position:fixed;inset:0;background:#FFFAF6;color:#3A2330;z-index:40;display:flex;flex-direction:column;padding:calc(var(--sat) + 12px) 20px calc(var(--sab) + 16px)}
.cook .ct{display:flex;align-items:center;gap:10px}
.cook .ib{background:#F9D5E1;border-color:#F0C3D3;color:#3A2330;box-shadow:none}
.cook .prog{flex:1;height:4px;background:#F9D5E1;border-radius:4px;overflow:hidden}
.cook .prog i{display:block;height:100%;background:#D6457A}
.cook .body{flex:1;overflow:auto;display:flex;flex-direction:column;justify-content:center;max-width:760px;margin:0 auto;width:100%;padding:20px 0}
.cook .num{color:#D6457A;font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px}
.cook .stxt{font-family:Fraunces,Georgia,serif;font-size:clamp(24px,5vw,36px);line-height:1.3}
.cook .tbtn{background:#FCE3EC;color:#D6457A;font-family:Inter,sans-serif;font-size:.8em;padding:2px 8px;vertical-align:middle}
.cook .nav{display:flex;gap:10px;max-width:760px;margin:0 auto;width:100%}
.cook .nav .btn{flex:1;background:#F9D5E1;border-color:#F0C3D3;color:#3A2330;box-shadow:none}
.cook .nav .btn.pri{background:#D6457A;border-color:transparent;color:#fff}
.cook .ingp{background:#FFF1F5;border-radius:16px;padding:6px 16px;margin-top:14px;max-height:45vh;overflow:auto}
.cook .ingp li{border-color:#F0D9E1}
/* timers */
#timers{position:fixed;left:18px;bottom:calc(var(--sab) + 16px);z-index:50;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
body[data-v=home] #timers,body[data-v=shop] #timers{bottom:calc(var(--sab) + 84px)}
body[data-v=chat] #timers{bottom:calc(var(--sab) + 136px)}
body.cooking #timers{bottom:calc(var(--sab) + 84px)}
.tm{display:flex;align-items:center;gap:10px;white-space:nowrap;max-width:min(260px,calc(100vw - 200px));background:#3A2330;color:#fff;border-radius:999px;padding:7px 8px 7px 14px;font-size:14px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.tm.done{background:#D6457A;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.04)}}
.tm button{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.15);display:grid;place-items:center}
.tm button svg{width:13px;height:13px}
/* sheet */
#ov{position:fixed;inset:0;background:rgba(58,35,48,.4);z-index:60;display:none;align-items:flex-end;justify-content:center}
#ov.on{display:flex}
.sh{background:var(--bg);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:18px 18px calc(var(--sab) + 18px);max-height:88vh;overflow:auto;animation:up .2s ease-out}
@media(min-width:620px){#ov{align-items:center}.sh{border-radius:24px}}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
.sh h3{font-family:Fraunces,Georgia,serif;font-size:22px;font-weight:600;margin:0 0 6px}
.sh p{margin:0 0 16px;color:var(--muted)}
.menu{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:12px}
.menu button{display:flex;align-items:center;gap:12px;padding:15px 16px;border-top:1px solid var(--line);text-align:left;font-weight:500}
.menu button:first-child{border-top:0}
.menu button svg{width:20px;height:20px;color:var(--muted)}
.menu button.red{color:#B83A2A}.menu button.red svg{color:#B83A2A}

<script>
'use strict';
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const newId=p=>(p||'')+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const sv=p=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>';
const IC={
 back:sv('<path d="M15 18l-6-6 6-6"/>'),plus:sv('<path d="M12 5v14M5 12h14"/>'),minus:sv('<path d="M5 12h14"/>'),
 heart:sv('<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/>'),
 heartF:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg>',
 book:sv('<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/>'),
 list:sv('<path d="M9 6h11M9 12h11M9 18h11"/><path d="M4.5 6h.01M4.5 12h.01M4.5 18h.01"/>'),
 cart:sv('<circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.7 12.4a2 2 0 0 0 2 1.6h8.6a2 2 0 0 0 2-1.5L22 7H6"/>'),
 spark:sv('<path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/>'),
 search:sv('<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>'),
 clock:sv('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),

 edit:sv('<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>'),
 trash:sv('<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>'),
 camera:sv('<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>'),
 link:sv('<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>'),
 play:sv('<path d="M6 4l14 8-14 8z"/>'),x:sv('<path d="M18 6L6 18M6 6l12 12"/>'),check:sv('<path d="M20 6L9 17l-5-5"/>'),
 more:sv('<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>'),
 copy:sv('<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>'),
 send:sv('<path d="M12 19V5M5 12l7-7 7 7"/>'),stop:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>',
 ext:sv('<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14L21 3"/>'),
 chat:sv('<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>'),
 image:sv('<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>'),
 text:sv('<path d="M4 7V4h16v3M9 20h6M12 4v16"/>'),
 info:sv('<circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/>'),
 wand:sv('<path d="M15 4V2M15 16v-2M8 9h2M20 9h2M17.8 11.8L19 13M15 9h.01M17.8 6.2L19 5M3 21l9-9M12.2 6.2L11 5"/>'),
 gear:sv('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'),
 sync:sv('<path d="M21 12a9 9 0 0 1-15.5 6.2L3 16M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5M3 21v-5h5"/>'),
 down:sv('<path d="M12 3v12M7 10l5 5 5-5M5 21h14"/>'),
 broom:sv('<path d="M19 3L12 10"/><path d="M14 13l-4-4-6 6c-1 1 1 5 4 6l6-8z"/>')
};
const SPIN='<div class="spin"></div>';

/* ---------- state ---------- */
const CFG=window.DELIGHTS_CONFIG||{};
const SB=String(CFG.supabaseUrl||'').replace(/\/+$/,''), SBK=CFG.supabaseKey||'';
let recipes={}, shop={items:[],updated:0}, pending={}, pendN={}, meta={}, cacheUser=null;
let view={name:'home'}, stack=[];
const ui={q:'',filter:'all'};
let mode='starting'; // starting | syncing | cloud | offline | auth
let session=null, lastSyncErr='';
let needRender=false;
const chat={turns:[],gem:[],busy:false,ctl:null,status:''};

/* ---------- local persistence ---------- */
const LS='delights.data.v1', LSS='delights.session';
function loadLocal(){try{const o=JSON.parse(localStorage.getItem(LS)||'null');if(o){recipes=o.recipes||{};shop=o.shop&&Array.isArray(o.shop.items)?o.shop:{items:[],updated:0};pending=o.pending||{};pendN=o.pendN||{};meta=o.meta||{};cacheUser=o.user||null}}catch(e){}
 try{session=JSON.parse(localStorage.getItem(LSS)||'null')}catch(e){}}
let lsT;function saveLocal(){clearTimeout(lsT);lsT=setTimeout(()=>{try{localStorage.setItem(LS,JSON.stringify({recipes,shop,pending,pendN,meta,user:cacheUser}))}catch(e){toast('This device is out of storage space.')}},250)}
function saveSession(){try{session?localStorage.setItem(LSS,JSON.stringify(session)):localStorage.removeItem(LSS)}catch(e){}}
function clearData(){recipes={};shop={items:[],updated:0};pending={};pendN={};meta={};signCache={};try{localStorage.removeItem(LSG)}catch(e){}saveLocal()}

/* ---------- Supabase ---------- */
async function authReq(path,body){let r;try{r=await fetch(SB+'/auth/v1/'+path,{method:'POST',headers:{apikey:SBK,'Content-Type':'application/json'},body:JSON.stringify(body)})}catch(e){throw{code:'offline'}}
 const j=await r.json().catch(()=>({}));if(!r.ok)throw{code:'auth',status:r.status,msg:j.error_description||j.msg||j.message||j.error||''};return j}
function setSess(j){session={access_token:j.access_token,refresh_token:j.refresh_token,expires_at:Date.now()+(j.expires_in||3600)*1000,user:{id:j.user&&j.user.id||session&&session.user.id,email:j.user&&j.user.email||session&&session.user.email}};saveSession()}
let refreshing=null;
async function token(){if(!session)throw{code:'auth'};
 if(Date.now()>session.expires_at-60000){
  if(!refreshing)refreshing=authReq('token?grant_type=refresh_token',{refresh_token:session.refresh_token}).then(setSess).finally(()=>{refreshing=null});
  try{await refreshing}catch(e){if(e.code==='auth'){session=null;saveSession();mode='auth';render()}throw e}}
 return session.access_token}
async function api(path,opts){opts=opts||{};const t=await token();let r;
 try{r=await fetch(SB+path,Object.assign({},opts,{headers:Object.assign({apikey:SBK,Authorization:'Bearer '+t},opts.headers||{})}))}catch(e){throw{code:'offline'}}
 if(r.status===401){session.expires_at=0;saveSession()}
 if(!r.ok){const tx=await r.text().catch(()=>'');throw{code:r.status===401?'auth':'http',status:r.status,msg:tx.slice(0,300)}}
 return r}
async function login(email,password){const j=await authReq('token?grant_type=password',{email,password});
 if(cacheUser&&cacheUser!==j.user.id)clearData();
 setSess(j);cacheUser=j.user.id;saveLocal();mode='syncing';stack=[];view={name:'home'};render();sync()}
async function logout(){if(Object.keys(pending).length&&!(await ask('Log out with unsynced changes?','Log out','Some changes haven’t reached the cloud yet and will be lost on this device.')))return;
 try{if(session)fetch(SB+'/auth/v1/logout',{method:'POST',headers:{apikey:SBK,Authorization:'Bearer '+session.access_token}}).catch(()=>{})}catch(e){}
 session=null;saveSession();cacheUser=null;clearData();chat.turns=[];chat.gem=[];render()}

/* ---------- sync ---------- */
function markPending(id,op){pending[id]=op;pendN[id]=(pendN[id]||0)+1;saveLocal();scheduleSync()}
let syncT=null,syncing=false,syncAgain=false;
function scheduleSync(ms){clearTimeout(syncT);syncT=setTimeout(sync,ms==null?900:ms)}
function rowFor(id){
 if(pending[id]==='del')return{id,kind:id==='shopping'?'shopping':'recipe',data:null,updated:Date.now(),deleted:true};
 if(id==='shopping')return{id,kind:'shopping',data:{items:shop.items},updated:shop.updated||Date.now(),deleted:false};
 const r=recipes[id];if(!r)return null;const d=Object.assign({},r);delete d.id;return{id,kind:'recipe',data:d,updated:r.updated||Date.now(),deleted:false}}
async function sync(){if(!session||!SB)return;if(syncing){syncAgain=true;return}syncing=true;
 if(mode!=='cloud')mode='syncing';updateSyncChip();let changed=false;
 try{
  // push
  const ids=Object.keys(pending);
  for(let k=0;k<ids.length;k+=40){const chunk=ids.slice(k,k+40);const snap={};chunk.forEach(id=>snap[id]=pendN[id]);
   const rows=chunk.map(rowFor).filter(Boolean);
   if(rows.length)await api('/rest/v1/delights_items?on_conflict=owner,id',{method:'POST',headers:{'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(rows)});
   for(const id of chunk){const row=rows.find(x=>x.id===id);if(row)meta[id]=row.updated;if(pendN[id]===snap[id]){delete pending[id];delete pendN[id]}}}
  // pull
  const list=await(await api('/rest/v1/delights_items?select=id,updated,deleted')).json();
  const need=[],seen=new Set();
  for(const x of list){seen.add(x.id);if(pending[x.id]||meta[x.id]===x.updated)continue;
   if(x.deleted){if(x.id==='shopping')shop={items:[],updated:x.updated};else delete recipes[x.id];meta[x.id]=x.updated;changed=true}else need.push(x.id)}
  for(let k=0;k<need.length;k+=30){const chunk=need.slice(k,k+30);
   const rows=await(await api('/rest/v1/delights_items?select=id,kind,data,updated&id=in.('+chunk.map(id=>encodeURIComponent('"'+id+'"')).join(',')+')')).json();
   for(const x of rows){if(pending[x.id])continue;
    if(x.kind==='shopping')shop={items:Array.isArray(x.data&&x.data.items)?x.data.items:[],updated:x.updated};
    else if(x.data){const r=Object.assign({},x.data,{id:x.id});recipes[x.id]=r}
    meta[x.id]=x.updated;changed=true}}
  for(const id of Object.keys(recipes))if(!seen.has(id)&&!pending[id]){pending[id]='set';pendN[id]=1;syncAgain=true}
  mode='cloud';lastSyncErr='';
 }catch(e){mode=e.code==='auth'?(session?'offline':'auth'):'offline';lastSyncErr=e.code==='http'?('Sync error '+e.status+(e.status===404?': run supabase-setup.sql in Supabase':'')):'';
  if(e.code==='http'&&e.status===404)toast('Sync table missing. Run supabase-setup.sql in Supabase.')}
 syncing=false;saveLocal();if(changed)softRender();else updateSyncChip();
 if(syncAgain){syncAgain=false;scheduleSync(300)}}
setInterval(()=>{if(document.visibilityState==='visible')sync()},30000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')sync()});
window.addEventListener('online',()=>sync());

/* ---------- data ops ---------- */
function putRecipe(r){r.updated=Date.now();if(!r.created)r.created=r.updated;recipes[r.id]=r;saveLocal();markPending(r.id,'set')}
function delRecipe(id){const r=recipes[id];delete recipes[id];markPending(id,'del');if(r)for(const p of r.photos||[])dropAsset(p)}
function putShop(){shop.updated=Date.now();saveLocal();markPending('shopping','set')}

/* ---------- quantities ---------- */
const FR={'½':.5,'⅓':1/3,'⅔':2/3,'¼':.25,'¾':.75,'⅛':.125,'⅜':.375,'⅝':.625,'⅞':.875,'⅕':.2};
const FRC='½⅓⅔¼¾⅛⅜⅝⅞⅕';
const NUM='(?:\\d+\\s+\\d+\\/\\d+|\\d+\\/\\d+|\\d+(?:[.,]\\d+)?\\s*['+FRC+']?|['+FRC+'])';
const LINE_RE=new RegExp('^('+NUM+')(?:\\s*(?:-|–|to)\\s*('+NUM+'))?\\s*(.*)$','i');
function pnum(s){s=String(s).trim().replace(',','.');let t=0;
 for(const part of s.split(/\s+/)){
  if(part.includes('/')){const[a,b]=part.split('/');t+=(+a)/(+b||1)}
  else{const m=part.match(new RegExp('^(\\d*(?:\\.\\d+)?)(['+FRC+'])?$'));if(!m)continue;t+=(m[1]?parseFloat(m[1]):0)+(m[2]?FR[m[2]]:0)}}
 return isFinite(t)?t:null}
const UNITS={g:'g',gr:'g',gram:'g',grams:'g',kg:'kg',kilo:'kg',kilos:'kg',kilogram:'kg',kilograms:'kg',mg:'mg',ml:'ml',milliliter:'ml',milliliters:'ml',millilitre:'ml',millilitres:'ml',l:'l',liter:'l',liters:'l',litre:'l',litres:'l',cl:'cl',dl:'dl',
 tsp:'tsp',teaspoon:'tsp',teaspoons:'tsp',tl:'tsp',tbsp:'tbsp',tbs:'tbsp',tablespoon:'tbsp',tablespoons:'tbsp',el:'tbsp',cup:'cup',cups:'cup',oz:'oz',ounce:'oz',ounces:'oz',lb:'lb',lbs:'lb',pound:'lb',pounds:'lb',
 pinch:'pinch',pinches:'pinch',dash:'dash',dashes:'dash',clove:'clove',cloves:'clove',can:'can',cans:'can',tin:'tin',tins:'tin',pack:'pack',packs:'pack',package:'pack',packages:'pack',packet:'pack',packets:'pack',
 slice:'slice',slices:'slice',stick:'stick',sticks:'stick',bunch:'bunch',bunches:'bunch',sprig:'sprig',sprigs:'sprig',handful:'handful',handfuls:'handful',piece:'piece',pieces:'piece',pcs:'piece',pc:'piece',head:'head',heads:'head',jar:'jar',jars:'jar',bottle:'bottle',bottles:'bottle'};
const PLURAL={cup:'cups',pinch:'pinches',dash:'dashes',clove:'cloves',can:'cans',tin:'tins',pack:'packs',slice:'slices',stick:'sticks',bunch:'bunches',sprig:'sprigs',handful:'handfuls',piece:'pieces',head:'heads',jar:'jars',bottle:'bottles'};
function normUnit(u){if(!u)return'';const k=String(u).toLowerCase().replace(/\.$/,'').trim();return UNITS[k]||k}
function parseLine(line){
 let s=line.trim().replace(/^[-•*·▢☐]\s*/,'');if(!s)return null;
 let qty=null,qty2=null,unit='',rest=s;
 const m=s.match(LINE_RE);
 if(m){qty=pnum(m[1]);qty2=m[2]?pnum(m[2]):null;rest=m[3]}
 const um=rest.match(/^([A-Za-zÀ-ÿ]+)\.?(?:\s+|$)(.*)$/);
 if(um&&UNITS[um[1].toLowerCase()]&&(qty!=null||um[2])){
  // avoid eating item words like "l" in non-quantity lines
  if(qty!=null||['pinch','dash','handful'].includes(UNITS[um[1].toLowerCase()])){unit=UNITS[um[1].toLowerCase()];rest=um[2]}}
 rest=rest.replace(/^of\s+/i,'');
 let item=rest,note='';const ci=rest.indexOf(',');if(ci>0){item=rest.slice(0,ci).trim();note=rest.slice(ci+1).trim()}
 return{qty,qty2,unit,item:item.trim(),note}}
function parseIngredients(text){const out=[];let sec='';
 for(const raw of String(text||'').split('\n')){const l=raw.trim();if(!l)continue;
  if(/^#+\s*/.test(l)||(/:$/.test(l)&&!LINE_RE.test(l)&&l.length<50)){sec=l.replace(/^#+\s*/,'').replace(/:$/,'').trim();continue}
  const p=parseLine(l);if(p&&p.item){p.section=sec;out.push(p)}}
 return out}
function fmtN(q,u){if(q==null||!isFinite(q))return'';
 if(/^(g|kg|mg|ml|l|cl|dl|oz|lb)$/.test(u||'')){if(q>=100)return String(Math.round(q/5)*5);if(q>=10)return String(Math.round(q));return String(Math.round(q*10)/10)}
 if(q>=10)return String(Math.round(q*2)/2).replace('.5','½');
 const w=Math.floor(q),fr=q-w;const opts=[[0,''],[.125,'⅛'],[.25,'¼'],[1/3,'⅓'],[.5,'½'],[2/3,'⅔'],[.75,'¾'],[1,'']];
 for(const[v,s]of opts)if(Math.abs(fr-v)<0.045){const whole=w+(v===1?1:0);if(!s)return String(whole);return(whole?whole:'')+s}
 return String(Math.round(q*100)/100)}
function fmtUnit(u,q){if(!u)return'';return(q!=null&&q>1&&PLURAL[u])?PLURAL[u]:u}
function fmtAmt(g,f){f=f||1;if(g.qty==null)return'';const q=g.qty*f,q2=g.qty2!=null?g.qty2*f:null;
 return(fmtN(q,g.unit)+(q2!=null?'–'+fmtN(q2,g.unit):'')+(g.unit?' '+fmtUnit(g.unit,q2??q):'')).trim()}
function ingToLine(g){return[fmtAmt(g,1),g.item].filter(Boolean).join(' ')+(g.note?', '+g.note:'')}
function ingsToText(list){let out=[],sec='';for(const g of list||[]){if((g.section||'')!==sec){sec=g.section||'';if(sec)out.push((out.length?'\n':'')+sec+':')}out.push(ingToLine(g))}return out.join('\n')}
function fmtTime(m){m=Math.round(+m||0);if(!m)return'';if(m<60)return m+' min';const h=Math.floor(m/60),r=m%60;return h+' h'+(r?' '+r+' min':'')}
const totalTime=r=>(+r.prep||0)+(+r.cook||0);

/* ---------- photos (Supabase Storage) ---------- */
const BUCKET='delights-photos', LSG='delights.signed';
let signCache={};try{signCache=JSON.parse(localStorage.getItem(LSG)||'{}')}catch(e){}
let signQ=new Set(),signT=null;const signFail={};
function photoSrc(p){if(!p)return'';if(p.d)return p.d;if(p.u)return p.u;
 if(p.s){const c=signCache[p.s];if(c&&c.exp>Date.now()+3600e3)return c.u;if(!signFail[p.s]||signFail[p.s]<Date.now()){signQ.add(p.s);clearTimeout(signT);signT=setTimeout(signNow,30)}return c&&c.exp>Date.now()?c.u:''}
 return''}
async function signNow(){const paths=[...signQ];signQ.clear();if(!paths.length||!session)return;
 try{const r=await api('/storage/v1/object/sign/'+BUCKET,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({expiresIn:604800,paths})});
  const out=await r.json();
  for(const x of out){if(x.signedURL){const u=/^https?:/.test(x.signedURL)?x.signedURL:SB+'/storage/v1'+(x.signedURL.startsWith('/')?'':'/')+x.signedURL;signCache[x.path]={u,exp:Date.now()+604800e3}}else signFail[x.path]=Date.now()+60e3}
  const keep={};for(const k in signCache)if(!signCache[k].local)keep[k]=signCache[k];try{localStorage.setItem(LSG,JSON.stringify(keep))}catch(e){}
  if(view.name==='edit')refreshPhotos();else softRender()
 }catch(e){paths.forEach(p=>signFail[p]=Date.now()+30e3)}}
const coverSrc=r=>photoSrc((r.photos||[])[0]);
async function toJpeg(file,max,q){const url=URL.createObjectURL(file);
 try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
  let w=img.naturalWidth,h=img.naturalHeight;const s=Math.min(1,max/Math.max(w,h));w=Math.max(1,Math.round(w*s));h=Math.max(1,Math.round(h*s));
  const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
  return await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('encode')),'image/jpeg',q))}
 finally{URL.revokeObjectURL(url)}}

function catOf(item){const s=String(item||'').toLowerCase();for(const[c,rx]of CAT_RX)if(rx.test(s))return c;return'Other'}
function keyOf(item){let s=String(item||'').toLowerCase().replace(/\(.*?\)/g,'').replace(/[^a-z0-9à-ÿğüşıöç ]/g,' ').replace(/\s+/g,' ').trim();
 s=s.replace(/\b(fresh|large|small|medium|chopped|diced|minced|sliced|grated|finely|roughly)\b/g,'').replace(/\s+/g,' ').trim();
 if(/oes$/.test(s))s=s.slice(0,-2);else if(/ies$/.test(s))s=s.slice(0,-3)+'y';else if(/[^s]s$/.test(s)&&s.length>3)s=s.slice(0,-1);return s}
function canon(q,u){u=normUnit(u);if(u==='kg')return[q*1000,'g'];if(u==='l')return[q*1000,'ml'];if(u==='cl')return[q*10,'ml'];if(u==='dl')return[q*100,'ml'];return[q,u]}
function addAmt(amounts,q,u){if(q==null||!isFinite(q))return;const[cq,cu]=canon(q,u);const ex=amounts.find(a=>a.u===cu);if(ex)ex.q=Math.round((ex.q+cq)*1000)/1000;else amounts.push({q:cq,u:cu})}
function fmtAmounts(am){return(am||[]).map(a=>{let q=a.q,u=a.u;if(!/^(g|kg|mg|ml|l|cl|dl|oz|lb|tsp|tbsp|cup|pinch|dash)$/.test(u||''))q=Math.ceil(q-0.05);if(u==='g'&&q>=1000){q=q/1000;u='kg'}if(u==='ml'&&q>=1000){q=q/1000;u='l'}return(fmtN(q,u)+(u?' '+fmtUnit(u,q):'')).trim()}).join(' + ')}
function addToShop(list,srcId){let n=0;
 for(const g of list){const item=String(g.item||'').trim();if(!item)continue;const k=keyOf(item);
  let ex=shop.items.find(i=>!i.done&&keyOf(i.item)===k);
  if(!ex){ex={id:newId('i'),item:item,amounts:[],cat:g.cat&&CATS.includes(g.cat)?g.cat:catOf(item),done:false,src:[]};shop.items.push(ex)}
  if(g.qty!=null)addAmt(ex.amounts,+g.qty,g.unit||'');
  if(srcId&&!ex.src.includes(srcId))ex.src.push(srcId);n++}
 putShop();return n}

const deadModels=new Set();
async function gemini(body,signal){let last=null;
 for(const m of aiModels()){if(deadModels.has(m))continue;let r;
  try{r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+m+':generateContent?key='+encodeURIComponent(aiKey()),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal})}
  catch(e){if(e&&e.name==='AbortError')throw{code:'cancelled'};throw{code:'offline'}}
  if(r.ok){const j=await r.json();if(j.promptFeedback&&j.promptFeedback.blockReason)throw{code:'refused'};return j}
  const j=await r.json().catch(()=>({}));const msg=(j.error&&j.error.message)||'';const st=r.status;
  if(st===400&&/location/i.test(msg))throw{code:'location'};
  if((st===400&&/api[ _]?key/i.test(msg))||st===401||st===403)throw{code:'key'};
  if(st===404)deadModels.add(m);
  if(st===404||st===429||st>=500||(st===400&&/model|not supported/i.test(msg))){last={code:st===429?'limit':'http',status:st,msg};continue}
  throw{code:'http',status:st,msg}}
 throw last||{code:'http',status:0}}
function textOf(j){const c=j&&j.candidates&&j.candidates[0];if(!c||!c.content){if(c&&/SAFETY|PROHIBITED|BLOCK/.test(c.finishReason||''))throw{code:'refused'};throw{code:'empty_completion'}}
 return(c.content.parts||[]).filter(p=>p.text&&!p.thought).map(p=>p.text).join('')}
function parseJSONLoose(t){t=String(t||'').trim();try{return JSON.parse(t)}catch(e){}
 const f=t.match(/```(?:json)?\s*([\s\S]*?)```/);if(f){try{return JSON.parse(f[1])}catch(e){}}
 const a=t.search(/[\[{]/),b=Math.max(t.lastIndexOf('}'),t.lastIndexOf(']'));if(a>=0&&b>a){try{return JSON.parse(t.slice(a,b+1))}catch(e){}}
 throw{code:'invalid_json'}}
async function aiJSON(prompt,o){o=o||{};const parts=[{text:prompt}];
 for(const b of o.images||[]){const d=await blobToData(b);parts.push({inline_data:{mime_type:'image/jpeg',data:d.split(',')[1]}})}
 const body={contents:[{role:'user',parts}],generationConfig:{temperature:.4}};
 if(o.urlTool)body.tools=[{url_context:{}}];else body.generationConfig.responseMimeType='application/json';
 let j;try{j=await gemini(body,o.signal)}catch(e){if(o.urlTool&&e.code==='http'&&e.status===400){delete body.tools;body.generationConfig.responseMimeType='application/json';j=await gemini(body,o.signal)}else throw e}
 return parseJSONLoose(textOf(j))}

const RECIPE_RULES=`Field rules:
- qty is a number (decimals allowed, e.g. 0.5), qty2 only for ranges like "2-3", null when there is no amount.
- unit is a short unit (g, kg, ml, l, tsp, tbsp, cup, oz, lb, clove, can, pinch, slice, bunch, piece, ...) or "" for countable things like "2 eggs".
- item is the ingredient name only; preparation goes in note ("finely chopped").
- section groups ingredients ("Sauce", "Dough"); use "" when there are no groups.
- steps: clear imperative instructions, one step per array entry, no numbering, no emojis.
- tags: 2-5 short lowercase tags (meal type, main ingredient, cuisine, diet).
- prepMinutes/cookMinutes: integers, estimate if not given; servings: integer, estimate if not given.
- Ignore hashtags, promo text, "link in bio", music credits and engagement bait.`;

/* ---------- timers ---------- */
let timers=[],tick=null,actx=null;
function startTimer(secs,label){try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();actx.resume&&actx.resume()}catch(e){}
 timers.push({id:newId('t'),label,end:Date.now()+secs*1000,done:false});if(!tick)tick=setInterval(drawTimers,500);drawTimers()}
function beep(){if(!actx)return;try{const t=actx.currentTime;for(let k=0;k<3;k++){const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.0001,t+k*.35);g.gain.exponentialRampToValueAtTime(.3,t+k*.35+.02);g.gain.exponentialRampToValueAtTime(.0001,t+k*.35+.25);o.start(t+k*.35);o.stop(t+k*.35+.3)}}catch(e){}}
function drawTimers(){const now=Date.now();let h='';
 for(const t of timers){const left=Math.max(0,Math.round((t.end-now)/1000));if(!left&&!t.done){t.done=true;beep();try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}}
  const mm=Math.floor(left/60),ss=String(left%60).padStart(2,'0');
  h+='<div class="tm '+(t.done?'done':'')+'">'+IC.clock.replace('<svg','<svg style="width:16px;height:16px"')+'<span style="overflow:hidden;text-overflow:ellipsis">'+(t.done?'Time’s up!':mm+':'+ss)+'</span>'+'<button data-a="tstop" data-id="'+t.id+'" aria-label="Dismiss timer">'+IC.x+'</button></div>'}
 $('#timers').innerHTML=h;if(!timers.length&&tick){clearInterval(tick);tick=null}}

function recipeText(r){let t=r.title+'\n'+(r.description?r.description+'\n':'')+(r.servings?'\nServes '+r.servings:'')+(totalTime(r)?' · '+fmtTime(totalTime(r)):'')+'\n\nIngredients\n';
 let sec='';for(const g of r.ingredients||[]){if((g.section||'')!==sec){sec=g.section||'';if(sec)t+='\n'+sec+':\n'}t+='- '+ingToLine(g)+'\n'}
 t+='\nMethod\n'+(r.steps||[]).map((s,i)=>(i+1)+'. '+s).join('\n');if(r.notes)t+='\n\nNotes\n'+r.notes;const su=r.source&&r.source.url;if(su)t+='\n\nSource: '+su;return t}

function saveDraft(){const d=view.draft;const title=d.title.trim();if(!title){toast('Give your recipe a title');const t=document.querySelector('[data-f="title"]');t&&t.focus();return}
 const prev=recipes[d.id]||{};
 const r=Object.assign({},prev,{id:d.id,title,description:d.description.trim(),servings:parseInt(d.servings)||null,prep:parseInt(d.prep)||null,cook:parseInt(d.cook)||null,
  tags:d.tags.split(',').map(t=>t.trim().toLowerCase().replace(/^#/,'')).filter(Boolean).slice(0,8),ingredients:parseIngredients(d.ing),
  steps:d.steps.split(/\n+/).map(s=>s.replace(/^\s*(step\s*)?\d+[.):]\s*/i,'').trim()).filter(Boolean),notes:d.notes.trim(),
  source:safeUrl(d.url.trim())?{url:safeUrl(d.url.trim())}:null,photos:d.photos,aiNote:d.aiNote||'',fav:d.fav,created:d.created||prev.created||null});
 putRecipe(r);d.removed.forEach(dropAsset);
 if(view.isNew){stack=[{name:'home'}];view={name:'recipe',id:r.id};render();window.scrollTo(0,0);toast('Recipe saved')}
 else{back();toast('Saved')}}

/* import run */
async function runImport(){const v=view;v.err='';
 let prompt,images=null,urlTool=false;
 if(v.tab==='gen'){if(!v.gen.trim()){v.err='Describe what you’d like to cook.';render();return}prompt=generatePrompt(v.gen.trim(),parseInt(v.gservings)||null)}
 else if(v.tab==='photo'){if(!v.files.length){v.err='Add at least one image.';render();return}images=v.files.map(f=>f.blob);prompt=importPrompt(v.url.trim(),'',v.note.trim(),true,false)}
 else{if(!v.url.trim()&&!v.text.trim()){v.err='Paste a link or the recipe text.';render();return}
  urlTool=!!safeUrl(v.url.trim())&&v.text.trim().length<200;prompt=importPrompt(v.url.trim(),v.text.trim(),v.note.trim(),false,urlTool)}
 const ctl=new AbortController();v.ctl=ctl;v.busy=true;v.status=v.tab==='gen'?'Creating your recipe…':v.tab==='photo'?'Reading your images…':urlTool?'Opening the link…':'Reading the recipe…';render();
 try{const out=await aiJSON(prompt,{images,urlTool,signal:ctl.signal});
  if(!out||typeof out!=='object'||Array.isArray(out))throw{code:'invalid_json'};
  if(out.error){v.busy=false;v.err=String(out.error);if(view===v)render();return}
  const url=safeUrl(v.url.trim());
  const r=recipeFromAI(out,{source:url?{url}:null});
  if(!r.ingredients.length&&!r.steps.length){v.busy=false;v.err='Couldn’t find a recipe in that. Try pasting the full caption or a clearer screenshot.';if(view===v)render();return}
  const d=draftOf(r);
  if(v.tab==='photo'&&v.usecover&&v.files[0]){try{const p=await storePhoto(v.files[0].blob);d.photos.push(p);d.added.push(p)}catch(e){}}
  v.busy=false;if(view!==v)return;
  view={name:'edit',isNew:true,fromAI:true,draft:d};render();window.scrollTo(0,0);
 }catch(e){v.busy=false;v.err=e&&e.code==='cancelled'?'':aiErr(e);if(view===v)render()}}

/* shopping tidy */
async function tidyShop(){const open=shop.items.filter(i=>!i.done);if(open.length<2){toast('Nothing to tidy yet');return}
 toast('Tidying your list…');
 const data=open.map(i=>({id:i.id,item:i.item,amounts:i.amounts}));
 try{const out=await aiJSON(`Tidy this shopping list. Merge entries that are the same thing to buy (e.g. "garlic cloves" and "minced garlic" -> "garlic"; "red onion" stays separate from "onion"). Add amounts together when units match or convert cleanly; otherwise keep several amounts. Use short, clear item names in the list's language. Put each item in exactly one category: ${CATS.join(', ')}.
Items (JSON, amounts use q=quantity, u=unit):
${JSON.stringify(data)}
Reply with only a JSON array: [{"item":"garlic","amounts":[{"q":4,"u":"clove"}],"cat":"Produce","from":["<ids of the input items merged into this one>"]}]`);
  if(!Array.isArray(out)||!out.length)throw{code:'invalid_json'};
  const before=shop.items.slice();const byId={};open.forEach(i=>byId[i.id]=i);
  const merged=out.filter(o=>o&&o.item).map(o=>{const src=new Set();(o.from||[]).forEach(id=>{const it=byId[id];it&&(it.src||[]).forEach(s=>src.add(s))});
   const am=[];(Array.isArray(o.amounts)?o.amounts:[]).forEach(a=>{if(a&&isFinite(+a.q))addAmt(am,+a.q,a.u||'')});
   return{id:newId('i'),item:String(o.item).trim(),amounts:am,cat:CATS.includes(o.cat)?o.cat:catOf(o.item),done:false,src:[...src]}});
  shop.items=merged.concat(shop.items.filter(i=>i.done));putShop();if(view.name==='shop')render();
  toast('List tidied: '+open.length+' → '+merged.length+' items','Undo',()=>{shop.items=before;putShop();render()})
 }catch(e){toast(aiErr(e))}}

/* assistant */
function chatRules(){const list=Object.values(recipes).sort((a,b)=>(b.created||0)-(a.created||0)).slice(0,300).map(r=>r.id+' | '+r.title+(r.fav?' ★':'')+' | '+(r.tags||[]).join(', ')+' | '+(fmtTime(totalTime(r))||'?')+' | serves '+(r.servings||'?')+' | main: '+(r.ingredients||[]).slice(0,6).map(g=>g.item).join(', ')).join('\n');
 const sl=shop.items.filter(i=>!i.done).map(i=>[fmtAmounts(i.amounts),i.item].filter(Boolean).join(' ')).join('; ');
 return`You are the kitchen assistant inside "Delights Recipes", the user's personal recipe app. You can see a summary of their saved recipes below and you have tools to read a recipe in full, add groceries to their shopping list, and save new recipes into their collection.

How to behave:
- Be warm, concise and practical. Use short paragraphs or "- " bullet lists and **bold** for recipe names. No tables, no headings.
- Reply in the language the user writes in.
- Prefer the user's own saved recipes when they fit; refer to them by exact title. Use get_recipe before giving details of a saved recipe.
- When the user asks you to add things to the shopping list or to save a recipe, just do it with the tools (no need to ask first) and then say briefly what you did.
- When adding groceries for saved recipes, read each recipe with get_recipe and pass its id as recipe_id. Skip basics like water, and salt and pepper unless asked.
- save_recipe creates a NEW recipe (e.g. a variation, or an idea the user liked); it never changes existing ones.
- If you suggest a new recipe idea in chat, keep it short and offer to save it.

Saved recipes (id | title | tags | total time | servings | main ingredients):
${list||'(none yet)'}

Current shopping list: ${sl||'(empty)'}`}
const ING_SCHEMA={type:'OBJECT',properties:{section:{type:'STRING'},qty:{type:'NUMBER',nullable:true},unit:{type:'STRING'},item:{type:'STRING'},note:{type:'STRING'}},required:['item']};
const CHAT_TOOLS=[
 {name:'get_recipe',description:'Return the full saved recipe (ingredients with amounts, steps, notes) for a recipe id from the list.',parameters:{type:'OBJECT',properties:{id:{type:'STRING'}},required:['id']},
  run:a=>{const r=recipes[String(a.id)];if(!r)throw new Error('No recipe with that id');return{title:r.title,servings:r.servings,prepMinutes:r.prep,cookMinutes:r.cook,tags:r.tags,ingredients:(r.ingredients||[]).map(ingToLine),steps:r.steps,notes:r.notes}}},
 {name:'add_to_shopping_list',description:'Add grocery items to the user\'s shopping list. Duplicates are merged automatically. Returns how many were added.',
  parameters:{type:'OBJECT',properties:{recipe_id:{type:'STRING',description:'Saved recipe id these items are for, if any'},items:{type:'ARRAY',items:{type:'OBJECT',properties:{qty:{type:'NUMBER',nullable:true},unit:{type:'STRING'},item:{type:'STRING'}},required:['item']}}},required:['items']},
  run:(a,msg)=>{const list=(Array.isArray(a.items)?a.items:[]).map(g=>({qty:g&&g.qty!=null&&isFinite(+g.qty)?+g.qty:null,unit:normUnit(g&&g.unit||''),item:String(g&&g.item||'').trim()})).filter(g=>g.item);
   const rid=a.recipe_id&&recipes[String(a.recipe_id)]?String(a.recipe_id):null;const n=addToShop(list,rid);msg.actions.push({label:'Added '+n+' item'+(n===1?'':'s')+' to shopping list'+(rid?' for '+recipes[rid].title:'')});return'Added '+n+' items.'}},
 {name:'save_recipe',description:'Save a NEW recipe into the user\'s collection. Returns the new id.',
  parameters:{type:'OBJECT',properties:{title:{type:'STRING'},description:{type:'STRING'},servings:{type:'INTEGER'},prepMinutes:{type:'INTEGER'},cookMinutes:{type:'INTEGER'},tags:{type:'ARRAY',items:{type:'STRING'}},ingredients:{type:'ARRAY',items:ING_SCHEMA},steps:{type:'ARRAY',items:{type:'STRING'}},notes:{type:'STRING'}},required:['title','ingredients','steps']},
  run:(o,msg)=>{const r=recipeFromAI(o||{},{aiNote:''});if(!r.ingredients.length)throw new Error('Recipe needs ingredients');putRecipe(r);msg.actions.push({label:'Saved “'+r.title+'”',id:r.id});return{id:r.id,saved:true}}}];
async function sendChat(){if(chat.busy)return;const text=(chat.draft||'').trim();if(!text)return;
 chat.turns.push({role:'user',content:text});chat.draft='';const msg={role:'assistant',content:'',actions:[]};chat.turns.push(msg);
 chat.busy=true;chat.status='Thinking…';const ctl=new AbortController();chat.ctl=ctl;render();scrollChat();
 // keep history short, cut only at a plain user turn
 while(chat.gem.length>30){const i=chat.gem.findIndex((c,k)=>k>0&&c.role==='user'&&c.parts.some(p=>p.text));if(i<0){chat.gem=[];break}chat.gem=chat.gem.slice(i)}
 const contents=chat.gem.slice();contents.push({role:'user',parts:[{text}]});
 const tools=[{functionDeclarations:CHAT_TOOLS.map(t=>({name:t.name,description:t.description,parameters:t.parameters}))}];
 try{
  for(let round=0;round<6;round++){
   const j=await gemini({systemInstruction:{parts:[{text:chatRules()}]},contents,tools,generationConfig:{temperature:.7}},ctl.signal);
   const cand=j.candidates&&j.candidates[0];const content=cand&&cand.content;if(!content||!content.parts){textOf(j);break}
   if(!content.role)content.role='model';contents.push(content);
   const t=content.parts.filter(p=>p.text&&!p.thought).map(p=>p.text).join('').trim();
   if(t){msg.content=(msg.content?msg.content+'\n\n':'')+t;chat.status=''}
   const calls=content.parts.filter(p=>p.functionCall);
   if(!calls.length)break;
   chat.status='Working on it…';if(view.name==='chat')render();
   const resps=[];for(const c of calls){const tool=CHAT_TOOLS.find(x=>x.name===c.functionCall.name);let result;
    try{if(!tool)throw new Error('Unknown tool');result=await tool.run(c.functionCall.args||{},msg)}catch(e){result={error:String(e&&e.message||e)}}
    resps.push({functionResponse:{name:c.functionCall.name,response:{result}}})}
   contents.push({role:'user',parts:resps});if(view.name==='chat')render()}
  chat.gem=contents;if(!msg.content&&!msg.actions.length)msg.err='No answer came back. Try asking again.';
 }catch(e){if(e&&e.code==='cancelled'){if(!msg.content)msg.err='Stopped.'}else msg.err=aiErr(e)}
 chat.busy=false;chat.status='';chat.ctl=null;if(view.name==='chat'){render();scrollChat()}}
function scrollChat(soft){const near=window.innerHeight+window.scrollY>=document.body.scrollHeight-260;if(!soft||near)window.scrollTo(0,document.body.scrollHeight)}

Object.assign(A,{
 settings:()=>{closeSheet();go({name:'settings'})},
 syncnow:()=>{sync();toast('Syncing…')},
 logout:()=>logout(),
 savekey:()=>{const v=$('#aikey').value.trim();if(!v){toast('Paste your key first');return}try{localStorage.setItem(AIK,v)}catch(e){}aiBlockedClear();toast('AI key saved');render()},
 delkey:async()=>{if(await ask('Remove the AI key from this device?','Remove')){try{localStorage.removeItem(AIK)}catch(e){}render()}},
 backup:()=>{const data={app:'delights-recipes',version:1,exported:new Date().toISOString(),recipes:Object.values(recipes),shopping:shop.items};
  const b=new Blob([JSON.stringify(data,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='delights-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)},
 restore:()=>{const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';inp.onchange=async()=>{const f=inp.files[0];if(!f)return;
  try{const o=JSON.parse(await f.text());const list=Array.isArray(o.recipes)?o.recipes:[];if(!list.length)throw 0;
   if(!(await ask('Restore '+list.length+' recipe'+(list.length===1?'':'s')+'?','Restore','Recipes with the same ID are replaced; everything else stays.')))return;
   for(const r of list){if(r&&r.id&&r.title){const c=Object.assign({},r);putRecipe(c)}}
   if(Array.isArray(o.shopping)&&o.shopping.length&&!shop.items.length){shop.items=o.shopping;putShop()}
   toast('Restored '+list.length+' recipes');render()}catch(e){toast('That file isn’t a Delights backup.')}};inp.click()}
});
